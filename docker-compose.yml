services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
      # network: host
    container_name: marvin-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: "/var/jenkins_home/casc_configs/my_marvin.yml"
      USER_CHOCOLATEEN_PASSWORD: "${USER_CHOCOLATEEN_PASSWORD:-1234}"
      USER_VAUGIE_G_PASSWORD: "${USER_VAUGIE_G_PASSWORD:-1234}"
      USER_I_DONT_KNOW_PASSWORD: "${USER_I_DONT_KNOW_PASSWORD:-1234}"
      USER_NASSO_PASSWORD: "${USER_NASSO_PASSWORD:-1234}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./my_marvin.yml:/var/jenkins_home/casc_configs/my_marvin.yml:ro
      - ./job_dsl.groovy:/var/jenkins_home/casc_configs/job_dsl.groovy:ro

volumes:
  jenkins_home:
